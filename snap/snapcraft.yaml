name: swirl-search # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

lint:
  ignore:
    - classic
    - library
parts:
  django-app:
    # See 'snapcraft plugins'
    plugin: python
    python-requirements: 
    - requirements.txt
    source: https://github.com/alexdlukens/swirl-search.git
    source-type: git
    source-branch: snap
    stage-packages:
      - python3
    
    override-build: |
      # copy over swirl_server dir
      cp -r $SNAPCRAFT_PART_SRC/swirl_server $SNAPCRAFT_PART_INSTALL
      cp -r $SNAPCRAFT_PART_SRC/swirl $SNAPCRAFT_PART_INSTALL
      cp -r $SNAPCRAFT_PART_SRC/SearchProviders $SNAPCRAFT_PART_INSTALL
      cp -r $SNAPCRAFT_PART_SRC/uploads $SNAPCRAFT_PART_INSTALL
      cp $SNAPCRAFT_PART_SRC/manage.py $SNAPCRAFT_PART_INSTALL
      cp $SNAPCRAFT_PART_SRC/swirl.py $SNAPCRAFT_PART_INSTALL
      cp $SNAPCRAFT_PART_SRC/requirements.txt $SNAPCRAFT_PART_INSTALL
      craftctl default

  swirl-start:
    plugin: nil
    source: .
    
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp $SNAPCRAFT_PART_SRC/snap/swirl-start $SNAPCRAFT_PART_INSTALL/bin/
      cp $SNAPCRAFT_PART_SRC/envfile $SNAPCRAFT_PART_INSTALL/envfile
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/swirl-start
      craftctl default

apps:
  swirl-search:
    command: bin/swirl-start
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
    environment:
      PYTHONPATH: "$PYTHONPATH:$SNAP/"
